name = "website"
compatibility_date = "2026-02-14"
# Worker code runs only for /api/* (play counter, article views and favorites, Ko-fi, photos); every other path is plain static assets.
main = "worker/site.js"

[assets]
directory = "./public/"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

# Song play counts (worker/site.js PlayCounter). SQLite Durable Objects are created on deploy; nothing to set up.
[[durable_objects.bindings]]
name = "PLAYS"
class_name = "PlayCounter"

[[migrations]]
tag = "v1-plays"
new_sqlite_classes = ["PlayCounter"]

# Ko-fi supporters (worker/site.js Supporters). Needs the KOFI_TOKEN secret (Ko-fi's verification token).
[[durable_objects.bindings]]
name = "SUPPORTERS"
class_name = "Supporters"

[[migrations]]
tag = "v2-supporters"
new_sqlite_classes = ["Supporters"]

# Article views and favorites (worker/site.js PostStats, /api/posts).
[[durable_objects.bindings]]
name = "POSTS"
class_name = "PostStats"

[[migrations]]
tag = "v3-posts"
new_sqlite_classes = ["PostStats"]

# Every 30 minutes, dispatch the feed workflows (worker/site.js scheduled); GitHub's own cron skips runs under load.
[triggers]
crons = ["*/30 * * * *"]
