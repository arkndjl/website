baseURL = 'https://arkndjl.net/'
languageCode = 'en-us'
title = 'arkndjl'
theme = 'terminal'
buildFuture = true
enableRobotsTXT = true

copyright = '© 2025-2026 Noah Dengler. All rights reserved.'

# Deploy stamp: /build.json carries the commit and time of the build (layouts/index.buildinfo.json), read by
# scripts/check_live.py and .github/workflows/deploy-check.yml. Cloudflare's build env names the commit.
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^WORKERS_CI_', '^CF_PAGES_']

[outputFormats.BuildInfo]
  mediaType = 'application/json'
  baseName = 'build'
  isPlainText = true
  notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'BuildInfo']

# Required for Chroma and the custom syntax highlighting.
[markup.highlight]
  noClasses = false

# Block attributes on markdown tables, e.g. {title="fv legend"} on the line after a table,
# read by layouts/_default/_markup/render-table.html.
[markup.goldmark.parser.attribute]
  block = true
  title = true

# Table of contents (opt in per post with `Toc = true` in front matter).
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  contentTypeName = "posts"
  showMenuItems = 7
  showLanguageSelector = false
  fullWidthTheme = false
  centerTheme = true
  autoCover = true
  showLastUpdated = false

  # Site-wide links. Used by the footer (layouts/partials/footer.html) and
  # the structured data in layouts/partials/extended_head.html.
  [params.links]
    eephus = "https://eephus.io"
    twitter = "https://x.com/ARKNDJL"
    instagram = "https://www.instagram.com/arkndjl/"
    substack = "https://substack.com/@arkndjl"
    github = "https://github.com/arkndjl"
    youtube = "https://www.youtube.com/@arkndjl"
    linkedin = "https://www.linkedin.com/in/noahdengler/"
    soundcloud = "https://soundcloud.com/arkndjl"
    email = "arkndjl@gmail.com"

[params.twitter]
  creator = "arkndjl"
  site = ""

[languages]
  [languages.en]
    languageName = "English"
    # Used in <title>, og:site_name and the footer. The header logo text is set
    # separately below (logoText).
    title = "arkndjl"

    [languages.en.params]
      # Used as the home page's meta description / og:description.
      subtitle = "arkndjl: Baseball Operations Analyst at Driveline, Data Science Consultant at Agentiq Sports. sabermetrics, prospect evaluation, economics, art. ARKBOARD; eephus.io / MLB PROSPX."
      owner = "arkndjl"
      keywords = "arkndjl, Noah Dengler, Driveline, Agentiq Sports, sabermetrics, baseball analytics, MLB prospects, farm systems, NBA draft, ARKBOARD, eephus.io, MLB PROSPX, economics, statistics"
      copyright = "© 2025-2026 Noah Dengler. All rights reserved."
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      newerPosts = "Newer posts"
      olderPosts = "Older posts"
      missingContentMessage = "Page not found..."
      missingBackButtonLabel = "Back to home page"
      minuteReadingTime = "min read"
      words = "words"

      [languages.en.params.logo]
        logoText = "🜎"
        logoHomeLink = "/"

