baseURL = 'https://arkndjl.net/'
languageCode = 'en-us'
title = 'arkndjl'
theme = 'terminal'
buildFuture = true
enableRobotsTXT = true
# Shown in the footer as "© <year> <copyright>".
copyright = 'arkndjl'


# Deploy stamp: /build.json carries the commit and time of the build (layouts/index.buildinfo.json), read by
# scripts/check_live.py and .github/workflows/deploy-check.yml. Cloudflare's build env names the commit.
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^WORKERS_CI_', '^CF_PAGES_']

[outputFormats.BuildInfo]
  mediaType = 'application/json'
  baseName = 'build'
  isPlainText = true
  notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'BuildInfo']

# Required for Chroma and the custom syntax highlighting.
[markup.highlight]
  noClasses = false

# Block attributes on markdown tables, e.g. {title="fv legend"} on the line after a table,
# read by layouts/_default/_markup/render-table.html.
[markup.goldmark.parser.attribute]
  block = true
  title = true

# Table of contents (opt in per post with `Toc = true` in front matter).
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  # dir name of your main content (default is `content/posts`).
  # the list of set content will show up on your index page (baseurl).
  contentTypeName = "posts"

  # if you set this to 0, only submenu trigger will be visible
  showMenuItems = 7

  # show selector to switch language
  showLanguageSelector = false

  # set theme to full screen width
  fullWidthTheme = false

  # center theme with default width
  centerTheme = true

  # if your resource directory contains an image called `cover.(jpg|png|webp)`,
  # then the file will be used as a cover automatically.
  # With this option you don't have to put the `cover` param in a front-matter.
  autoCover = true

  # set post to show the last updated
  # If you use git, you can set `enableGitInfo` to `true` and then post will automatically get the last updated
  showLastUpdated = false

  # Provide a string as a prefix for the last update date. By default, it looks like this: 2020-xx-xx [Updated: 2020-xx-xx] :: Author
  # updatedDatePrefix = "Updated"

  # whether to show a page's estimated reading time
  # readingTime = false # default

  # whether to show a table of contents
  # can be overridden in a page's front-matter
  # Toc = false # default

  # set title for the table of contents
  # can be overridden in a page's front-matter
  # TocTitle = "Table of Contents" # default

  # Set date/time format for posts
  # This will impact the date/time displayed on
  # index.html, the posts list page, and on posts themselves
  # This value can also be configured per-post on front matter
  # If you have any issues with the timezone rendering differently
  # than you expected, please ensure your timezone is correctly set
  # on your server.
  # This value can be customized according to Hugo documentation:
  # https://gohugo.io/functions/time/format/
  # Default value (no changes needed):
  # dateFormat = "2006-01-02"
  # Example format, with date, time, and timezone abbreviation:
  # dateFormat = "2006-01-02 3:04:06 PM MST"

  # Site-wide links. Used by the footer (layouts/partials/footer.html) and
  # the structured data in layouts/partials/extended_head.html.
  [params.links]
    eephus = "https://eephus.io"
    twitter = "https://x.com/ARKNDJL"
    substack = "https://substack.com/@arkndjl"
    github = "https://github.com/arkndjl"
    youtube = "https://www.youtube.com/@arkndjl"
    linkedin = "https://www.linkedin.com/in/noahdengler/"
    soundcloud = "https://soundcloud.com/arkndjl"
    email = "arkndjl@gmail.com"


[params.twitter]
  # set Twitter handles for Twitter cards
  # see https://developer.twitter.com/en/docs/tweets/optimize-with-cards/guides/getting-started#card-and-content-attribution
  # do not include @
  creator = "arkndjl"
  site = ""

[languages]
  [languages.en]
    languageName = "English"
    # Used in <title>, og:site_name and the footer. The header logo text is set
    # separately below (logoText).
    title = "arkndjl"

    [languages.en.params]
      # Used as the home page's meta description / og:description.
      subtitle = "arkndjl: Baseball Operations Analyst at Driveline, Data Science Consultant at Agentiq Sports. sabermetrics, prospect evaluation, economics, art. ARKBOARD; eephus.io / MLB PROSPX."
      owner = "arkndjl"
      keywords = "arkndjl, Noah Dengler, Driveline, Agentiq Sports, sabermetrics, baseball analytics, MLB prospects, farm systems, NBA draft, ARKBOARD, eephus.io, MLB PROSPX, economics, statistics"
      copyright = "arkndjl"
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      newerPosts = "Newer posts"
      olderPosts = "Older posts"
      missingContentMessage = "Page not found..."
      missingBackButtonLabel = "Back to home page"
      minuteReadingTime = "min read"
      words = "words"

      [languages.en.params.logo]
        logoText = "🜎"
        logoHomeLink = "/"

