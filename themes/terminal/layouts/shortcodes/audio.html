{{ if .Get "src" }}
<div class="audio-container" style="margin-bottom: 20px;">
    {{ with .Get "title" }}
        <p style="margin-bottom: 5px; font-weight: bold;">{{ . }}</p>
    {{ end }}

    <audio controls style="width: 100%;">
        <source src="{{ .Get "src" | safeURL }}" type="audio/mpeg">
    </audio>

    {{ with .Get "link" }}
        <p style="font-size: 0.8rem; margin-top: 5px;">
            <a href="{{ . | safeURL }}" target="_blank" rel="noopener">Listen on SoundCloud</a>
        </p>
    {{ end }}
</div>
{{ end }}
