# Rebuilds the NBA ARKBOARD's XPM leaderboard for the season in progress (static/data/nba-xpm/<season>.json,
# data/nba_xpm.json): databallr DPM read from its stats page (scripts/cbb_dpm.mjs, headless Chromium) and
# Basketball-Reference's advanced table, blended 50/50 by scripts/nba_xpm.py; then the game model's projections,
# power rankings, season odds and picks (scripts/nba_games.py: data/nba_games.json, data/nba_picks.json), and
# commits them; the push triggers the Cloudflare build. Daily from mid-October through the Finals in June, plus a
# late-afternoon run (games only) for the evening injury report, or by hand from the Actions tab. GitHub fires this
# schedule late or not at all on this repo, so a games-only run also follows each esea season / cfb board run (which
# do fire, several times a day) whenever the player projections are 4+ hours old: every day's slate gets its PRA lines. A DPM pull that
# fails keeps the season's last DPM; with nothing new nothing is committed.
name: nba xpm

on:
  schedule:
    # 11:23 UTC: after the last West Coast games and both sites' overnight updates
    - cron: "23 11 18-31 10 *"
    - cron: "23 11 * 11,12,1,2,3,4,5,6 *"
    # 22:40 UTC (6:40 PM ET, 5:40 in winter): the injury report before the evening tips; games only
    - cron: "40 22 * 10,11,12,1,2,3,4,5,6 *"
  workflow_dispatch:
  workflow_run:
    workflows: ["esea season", "cfb board"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: nba-xpm
  cancel-in-progress: false

jobs:
  # a run that follows another workflow goes ahead only in season and when data/nba_players.json is 4+ hours old
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/nba_players.json
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          try:
              asof = dt.datetime.fromisoformat(json.load(open('data/nba_players.json'))['asof'].replace('Z', '+00:00'))
          except Exception:
              asof = now - dt.timedelta(days=1)
          print('go=' + str(now.month not in (7, 8, 9) and now - asof >= dt.timedelta(hours=4)).lower())
          PY
  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull this season's DPM from databallr
        if: github.event_name != 'workflow_run' && github.event.schedule != '40 22 * 10,11,12,1,2,3,4,5,6 *'
        continue-on-error: true
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          season=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import nba_xpm; print(nba_xpm.current_season())")
          node scripts/cbb_dpm.mjs "$season"
      - name: Blend DPM and BPM into XPM
        if: github.event_name != 'workflow_run' && github.event.schedule != '40 22 * 10,11,12,1,2,3,4,5,6 *'
        run: python3 scripts/nba_xpm.py --current
      # XPM (proj) and contract surplus (scripts/nba_proj.py: static/data/nba-proj.json), Basketball-Reference contracts
      - name: XPM (proj) and contract value
        if: github.event_name != 'workflow_run' && github.event.schedule != '40 22 * 10,11,12,1,2,3,4,5,6 *'
        continue-on-error: true
        run: python3 scripts/nba_proj.py
      # rookie / first-year leaderboard tab (scripts/rookies.py -> static/data/rookies/nba.json), display only
      - name: Rookies tab
        continue-on-error: true
        run: python3 scripts/rookies.py nba
      # ESPN box scores and lines already pulled this season (final games never change)
      - uses: actions/cache@v4
        with:
          path: |
            scripts/.cache/nba/espn
            scripts/.cache/nba/pbox2
          key: nba-espn-${{ github.run_id }}
          restore-keys: nba-espn-
      - name: Project games, power rankings, season odds and picks
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null || true
          python3 scripts/nba_games.py
      # points, rebounds and assists for every rotation player (scripts/nba_players.py: data/nba_players.json)
      - name: Player projections
        continue-on-error: true
        run: python3 scripts/nba_players.py
      - name: Games page picks
        continue-on-error: true
        run: python3 scripts/games_picks.py nba
      # the live rule monitor (scripts/rule_monitor.py -> data/rule_monitor.json): every pick and paper rule against the close
      - name: Rule monitor
        continue-on-error: true
        run: python3 scripts/rule_monitor.py
      # our season sims next to DraftKings' futures from ESPN (scripts/futures_board.py; display only)
      - name: Futures board
        continue-on-error: true
        run: python3 scripts/futures_board.py nba
      # DraftKings' team futures, one snapshot a day, for a future market-prior backtest (scripts/futures_archive.py)
      - name: Futures archive
        continue-on-error: true
        run: python3 scripts/futures_archive.py nba $(python3 -c "import datetime as d; t=d.date.today(); print(t.year + (t.month >= 8))")
      - name: Backup watch (ESPN depth charts)
        run: python3 scripts/backup_watch.py nba || echo "backup watch not updated"
      # each game model's season so far against its own walk-forward record, and the model ledger's one-year re-tests
      # (scripts/model_monitor.py -> data/model_monitor/<sport>.json, on the Predictions page's game models tab)
      - name: Model monitor
        continue-on-error: true
        run: python3 scripts/model_monitor.py nba
      - name: Commit if the leaderboard changed
        run: |
          files="scripts/data/faces_nba.json static/data/nba-xpm static/data/nba-proj.json static/data/rookies/nba.json data/backup_nba.json static/data/depth/nba.json data/nba_xpm.json data/nba_games.json data/nba_draft_order.json data/nba_players.json data/nba_picks.json data/games_picks_nba.json data/rule_monitor.json data/futures_board_nba.json scripts/data/odds/nba-*.jsonl scripts/data/futures/archive data/model_monitor/nba.json scripts/data/model_monitor/nba.json static/data/teams/nba.json"
          for f in $files; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "arkboard-bot"; git config user.email "actions@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          python3 scripts/check_build.py || exit 1   # the build gate: strict JSON, file sizes (a bad file breaks every deploy)
          git commit -m "Update the NBA XPM leaderboard and games ($(date -u +%Y-%m-%d))"
          # main moves while this runs: rebuild the data commit on the new main and retry (see cbb-board.yml)
          data=$(git rev-parse HEAD); changed=$(git diff --name-only --diff-filter=d "$base" "$data")
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git fetch origin main && git reset -q --hard origin/main || exit 1
            if [ -n "$changed" ]; then git checkout "$data" -- $changed; fi
            for f in $files; do if [ -e "$f" ]; then git add "$f"; fi; done
            if git diff --cached --quiet; then echo "no changes on the new main"; exit 0; fi
            git commit -q -m "Update the NBA XPM leaderboard and games ($(date -u +%Y-%m-%d))"
          done
          exit 1
