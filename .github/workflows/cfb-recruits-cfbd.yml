# 247 composite classes from CFBD (scripts/cfb_recruits_cfbd.mjs; 247Sports itself is never requested). Run by hand
# from the Actions tab.
#   live = true (default): the classes being recruited, for the recruit tabs -> scripts/data/cfb_recruits_cfbd_live.json,
#     committed to main. 3 CFBD calls at most (one a class; none for a class pulled inside 6.5 days). The cfb board
#     workflow does the same pull weekly; this is the same step on demand.
#   live = false: signed classes first..last for the CFB FV harnesses -> scripts/data/cfb_recruits_cfbd.json.gz, uploaded
#     as an artifact (download it into scripts/data/ and commit). One call a class not yet in the cfbhist cache.
# Either way no call is made unless CFBD's count for the month, less the call, stays at or above min_left; with no
# board run in this job the first call's answer supplies the count (so under the reserve this run costs one call).
name: cfb recruits cfbd

on:
  workflow_dispatch:
    inputs:
      live:
        description: "the classes being recruited (recruit tabs), committed to main"
        type: boolean
        default: true
      first:
        description: "live = false: first signed class"
        default: "2009"
      last:
        description: "live = false: last signed class"
        default: "2025"
      min_left:
        description: "stop when fewer CFBD calls than this would remain this month"
        default: "500"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull the classes being recruited
        if: inputs.live
        run: node scripts/cfb_recruits_cfbd.mjs --live
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          MIN_LEFT: ${{ inputs.min_left || '500' }}
      - name: Commit the live classes
        if: inputs.live
        run: |
          git config user.name "arkboard-bot"; git config user.email "actions@users.noreply.github.com"
          python3 scripts/data_push.py -m "Update the CFBD 247 composite classes ($(date -u +%Y-%m-%d))" \
            -- scripts/data/cfb_recruits_cfbd_live.json
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.live }}
        with:
          path: scripts/.cache/cfb/hist
          key: cfbhist-none
          restore-keys: cfbhist-
      - name: Pull signed classes
        if: ${{ !inputs.live }}
        run: node scripts/cfb_recruits_cfbd.mjs ${{ inputs.first }} ${{ inputs.last }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          MIN_LEFT: ${{ inputs.min_left || '500' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.live }}
        with:
          name: cfb-recruits-cfbd
          path: scripts/data/cfb_recruits_cfbd.json.gz
          retention-days: 7
