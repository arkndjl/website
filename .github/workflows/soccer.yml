# Rebuilds the SOCCER ARKBOARD's matches, power rankings, league (big five + 13 more) and UEFA cup odds (scripts/soccer_games.py:
# data/soccer_games.json), player values, stats and backup watch (scripts/soccer_players.py) from ESPN's and FotMob's scores and fixtures, football-data.co.uk's prices, Understat's and FotMob's expected
# goals and Transfermarkt's injury lists, and commits them; the push triggers the Cloudflare build. Twice a day from August through May (morning UK
# time before the early kickoffs, and late evening after the last), by hand from the Actions tab, and after each
# esea season / cfb board run (those schedules do fire) whenever data/soccer_games.json is 6+ hours old. Past
# seasons are frozen in scripts/soccer_games_hist.json.gz (re-run `python3 scripts/soccer_games.py --hist` each
# summer, after the last league finishes).
name: soccer

on:
  schedule:
    - cron: "15 9 * 1,2,3,4,5,8,9,10,11,12 *"
    - cron: "45 22 * 1,2,3,4,5,8,9,10,11,12 *"
  workflow_dispatch:
  workflow_run:
    workflows: ["esea season", "cfb board"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: soccer
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/soccer_games.json
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          try:
              asof = dt.datetime.fromisoformat(json.load(open('data/soccer_games.json'))['asof'].replace('Z', '+00:00'))
          except Exception:
              asof = now - dt.timedelta(days=1)
          print('go=' + str(now.month not in (6, 7) and now - asof >= dt.timedelta(hours=6)).lower())
          PY
  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pillow
      # ESPN's finished calendar years and football-data's finished seasons never change
      # (and Transfermarkt profiles, refreshed weekly by scripts/soccer_mv.py)
      - uses: actions/cache@v4
        with:
          path: |
            scripts/.cache/soccer
            scripts/.cache/soccer_prospects/tm/players.json.gz
          key: soccer-${{ github.run_id }}
          restore-keys: soccer-
      - name: Project matches, power rankings, league and UEFA odds
        run: python3 scripts/soccer_games.py
      - name: Player values, stats and backup watch (Understat)
        run: python3 scripts/soccer_players.py
      - name: Estimated market values next to Transfermarkt's (a Transfermarkt outage keeps yesterday's)
        run: python3 scripts/soccer_mv.py || echo "market values skipped"
      # the other 13 leagues' player stats (FotMob), then flags, headshots and prospect FV on the player files
      - name: Other leagues' player stats (FotMob)
        continue-on-error: true
        run: python3 scripts/soccer_more.py
      - name: Flags, headshots and prospect FV (Transfermarkt)
        continue-on-error: true
        run: python3 scripts/soccer_faces.py
      # rookie / first-year leaderboard tab (scripts/rookies.py -> static/data/rookies/soccer.json), display only
      - name: Rookies tab
        continue-on-error: true
        run: python3 scripts/rookies.py soccer
      # each game model's season so far against its own walk-forward record, and the model ledger's one-year re-tests
      # (scripts/model_monitor.py -> data/model_monitor/<sport>.json, on the Predictions page's game models tab)
      - name: Model monitor
        continue-on-error: true
        run: python3 scripts/model_monitor.py soccer
      - name: Commit if anything changed
        run: |
          files="static/data/rookies/soccer.json data/soccer_games.json static/img/soccer static/data/soccer-more static/img/flags scripts/data/soccer_faces.json.gz data/soccer_war.json data/backup_soccer.json static/data/depth/soccer.json static/data/soccer-war scripts/data/soccer_mv_cur.json.gz data/model_monitor/soccer.json scripts/data/model_monitor/soccer.json static/data/teams/soccer.json"
          for f in $files; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "arkboard-bot"; git config user.email "actions@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          python3 scripts/check_build.py || exit 1   # the build gate: strict JSON, file sizes (a bad file breaks every deploy)
          git commit -m "Update the soccer matches ($(date -u +%Y-%m-%d))"
          data=$(git rev-parse HEAD); changed=$(git diff --name-only --diff-filter=d "$base" "$data")
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git fetch origin main && git reset -q --hard origin/main || exit 1
            if [ -n "$changed" ]; then git checkout "$data" -- $changed; fi
            for f in $files; do if [ -e "$f" ]; then git add "$f"; fi; done
            if git diff --cached --quiet; then echo "no changes on the new main"; exit 0; fi
            git commit -q -m "Update the soccer matches ($(date -u +%Y-%m-%d))"
          done
          exit 1
