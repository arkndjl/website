# Regenerates ARKBOARD Process (Research, Glossary/Methodology, Data Sources) from the live fit files after the board and
# refit workflows: scripts/library_glossary.py reads the fits (fv_scale, cbb_live_fit, hockey fit, board counts) into
# research/library.json, scripts/library_build.py writes data/library.json and content/arkboard-process.md. Never hand-edit
# those numbers (Noah, Nov 19 2026). Commits only when something changed.
name: process refresh

on:
  schedule:
    - cron: "50 */6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["cfb board", "cbb board", "cbb boards", "nfl", "nba xpm", "nhl", "soccer", "soccer prospects", "tennis", "tennis prospects", "cs2", "model refits"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: process-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild Process from the live fits
        run: |
          python3 scripts/library_glossary.py
          python3 scripts/library_build.py
      - name: Commit if anything changed
        run: |
          git add research/library.json data/library.json content/arkboard-process.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "arkboard-bot"; git config user.email "actions@users.noreply.github.com"
          python3 scripts/check_build.py || exit 1   # the build gate: strict JSON, file sizes
          git commit -m "Refresh ARKBOARD Process from the live fits ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -X theirs origin main || exit 1
          done
          exit 1
