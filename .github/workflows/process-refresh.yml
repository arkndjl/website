# Regenerates ARKBOARD Process (Overview, Metrics, Models, Research, Data) and ARKLOG from the live fit files after the board and
# refit workflows: scripts/library_glossary.py reads the fits (fv_scale, cbb_live_fit, hockey fit, board counts) into
# research/library.json, scripts/library_build.py writes data/library.json and content/arkboard-process.md. Never hand-edit
# those numbers (Noah, Nov 19 2026). Then the glossary GFX cards (scripts/glossary_gfx.py). ARKLOG (scripts/arklog.py) reads
# the newest merged pull requests into static/data/arklog.json and data/arklog.json. Commits only when something changed.
name: process refresh

on:
  schedule:
    - cron: "50 */6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["cfb board", "cbb board", "cbb boards", "nfl", "nba xpm", "nhl", "soccer", "soccer prospects", "tennis", "tennis prospects", "cs2", "cs2 ark loop", "model refits"]
    types: [completed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: process-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild Process from the live fits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/agencies.py   # agency board: client FV / x/y/zNIL from the boards just rebuilt
          python3 scripts/library_glossary.py
          # ARKLOG first: the Process overview prints its tallies. A failed fetch rebuilds from the cache.
          python3 scripts/arklog.py --fetch || python3 scripts/arklog.py
          python3 scripts/milestones.py         # ARKLOG > milestones from the social, site and log data
          python3 scripts/philosophy_build.py   # Process > Philosophy figures and numbers
          python3 scripts/library_build.py
      # the glossary GFX cards (scripts/glossary_gfx.py -> data/glossary_gfx.json): top 10s and distributions from the
      # season files, test numbers from the backtest files; stdlib, reads the repo only
      - name: Glossary GFX cards
        run: |
          python3 scripts/glossary_gfx.py
          python3 scripts/library_build.py   # the term windows draw the cards' pictures
      - name: Commit if anything changed
        run: |
          git add data/agencies_board.json static/data/agencies.json research/library.json data/library.json content/arkboard-process.md data/philosophy.json data/milestones.json data/glossary_gfx.json static/data/arklog.json data/arklog.json scripts/data/arklog_prs.json.gz
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "arkboard-bot"; git config user.email "actions@users.noreply.github.com"
          python3 scripts/check_build.py || exit 1   # the build gate: strict JSON, file sizes
          git commit -m "Refresh ARKBOARD Process from the live fits ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -X theirs origin main || exit 1
          done
          exit 1
