# The paper book (ARK Betting Plan, Oct 21 2026): DraftKings' lines through ESPN's scoreboard every 30 minutes through
# the US afternoon and evening and a few times overnight (scripts/odds_snap.py -> scripts/data/odds_dense/), then the
# paper book from the pre-registered rules (scripts/paper_book.py, scripts/paper_rules.json -> data/paper_book.json).
# Paper only, free data only. Commits only when a line, price, model number or bet changed; the push rebuilds the site.
# About 34 runs a day, roughly 1,000 Actions minutes a month; July is off (no games).
name: odds snap

on:
  schedule:
    - cron: "5,35 13-23 * 1-6,8-12 *"
    - cron: "5,35 0-4 * 1-6,8-12 *"
    - cron: "5 8,11 * 1-6,8-12 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # scripts/picks_refresh.py reads the sport builds' runs and dispatches a stale one

concurrency:
  group: odds-snap
  cancel-in-progress: false

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot the lines
        run: python3 scripts/odds_snap.py
      - name: Paper book
        run: python3 scripts/paper_book.py
      # NBA player props (DraftKings through ESPN) and their paper book (scripts/props_snap.py, scripts/props_paper.py)
      - name: Props snapshot and paper book
        continue-on-error: true
        run: |
          python3 scripts/props_snap.py
          python3 scripts/props_paper.py
      - name: NBA referee crews (forward log)
        continue-on-error: true
        run: python3 scripts/nba_refs.py --today
      # the Predictions page's picks on DraftKings' current lines, and a dispatch for any sport build gone stale
      # (scripts/picks_refresh.py; the same step runs in picks-refresh.yml on its own schedule)
      - name: Picks refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/picks_refresh.py
      # the Novig alt-line test (scripts/novig_ladder_test.py): graded picks priced on the best ladder rung vs the main one
      - name: Ladder test
        continue-on-error: true
        run: python3 scripts/novig_ladder_test.py
      - name: Commit if it changed
        run: |
          git config user.name "arkboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/data/odds_dense data/paper_book.json
          for d in scripts/data/odds_novig scripts/data/odds_novig_ladder scripts/data/odds_tp data/novig_ladder_test.json; do if [ -e "$d" ]; then git add "$d"; fi; done
          for f in scripts/data/props data/props_paper.json scripts/data/refs data/games_picks_cfb.json data/games_picks_nfl.json data/games_picks_cbb.json data/games_picks_nba.json data/games_picks_tennis.json scripts/data/odds; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          # Only the paper books and the picks are on the site; a snapshot-only commit skips the Cloudflare build.
          skip=""; git diff --cached --quiet -- data/paper_book.json data/props_paper.json data/games_picks_*.json && skip=" [skip ci]"
          python3 scripts/check_build.py || exit 1   # the build gate: strict JSON, file sizes (a bad file breaks every deploy)
          git commit -q -m "Odds snapshot, paper book and picks ($(date -u +%Y-%m-%dT%H:%MZ))$skip"
          for i in 1 2 3 4; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
