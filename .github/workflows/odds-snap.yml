# The paper book (ARK Betting Plan, Oct 21 2026): DraftKings' lines through ESPN's scoreboard every 30 minutes through
# the US afternoon and evening and a few times overnight (scripts/odds_snap.py -> scripts/data/odds_dense/), then the
# picks refresh and the paper book (scripts/paper_book.py -> data/paper_book.json: the Predictions picks, graded).
# Paper only, free data only. Commits only when a line, price, model number or bet changed; the push rebuilds the site.
# About 34 runs a day, roughly 1,000 Actions minutes a month; July is off (no games).
name: odds snap

on:
  schedule:
    - cron: "5,35 13-23 * 1-6,8-12 *"
    - cron: "5,35 0-4 * 1-6,8-12 *"
    - cron: "5 8,11 * 1-6,8-12 *"
  workflow_dispatch:
  # GitHub drops most of this repo's scheduled runs (Oct 28 2026: 5 of 34 odds snaps fired, none 05:17-14:55 UTC,
  # while the sport builds' schedules kept firing). Each finished build also starts a snap, which also
  # puts the build's new picks into the paper book within minutes.
  workflow_run:
    workflows: ["esea season", "tennis", "cs2", "nfl", "cfb board", "soccer", "nba xpm", "nhl", "cbb board", "soccer prospects", "tennis prospects"]
    types: [completed]

permissions:
  contents: write
  actions: write     # scripts/picks_refresh.py reads the sport builds' runs and dispatches a stale one

concurrency:
  group: odds-snap
  cancel-in-progress: false

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ref main: a workflow_run event pins GITHUB_SHA to main as it was when the build finished, so a snap that
      # queued behind another one started on a stale commit and its jsonl appends conflicted on the push (27 lost
      # snapshots Oct 29-Nov 1)
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Snapshot the lines
        run: python3 scripts/odds_snap.py
      # RotoWire's injury news, every sport (scripts/rotowire.py -> scripts/data/rotowire_news.json): its free pages show
      # the newest 25 items, under a day in season, so the log is kept here every half hour for the sport builds
      - name: RotoWire injury news
        continue-on-error: true
        timeout-minutes: 4
        run: python3 scripts/rotowire.py
      # RotoWire's roster moves (trades, claims, signings, releases, call-ups, send-downs, college exits): the news feed
      # since the last poll (scripts/rotowire_moves.py -> scripts/data/rotowire_moves/), then every board's roster
      # checked against it (scripts/roster_audit.py -> data/roster_audit.json). The sport builds retag clubs from it.
      # Then each sport's transactions tab (scripts/transactions.py -> data/transactions/; soccer's Transfermarkt pull
      # once a day).
      - name: RotoWire roster moves
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 scripts/rotowire_moves.py --calls 20
          python3 scripts/roster_audit.py
          python3 scripts/transactions.py
      # NBA and NFL player props (Novig, DraftKings through ESPN), NFL first-half lines and team totals, and the paper
      # books (scripts/props_snap.py, scripts/props_paper.py, scripts/nfl_props_paper.py)
      - name: Props snapshot and paper book
        continue-on-error: true
        run: |
          python3 scripts/props_snap.py
          python3 scripts/props_paper.py
          python3 scripts/nfl_props_paper.py
          python3 scripts/props_daily.py nhl     # NHL saves paper test (off the picks tab)
          python3 scripts/soccer_props_snap.py   # soccer: Novig's asks only, for a later real-price test
      - name: NBA referee crews (forward log)
        continue-on-error: true
        run: python3 scripts/nba_refs.py --today
      # the Predictions page's picks on DraftKings' current lines, and a dispatch for any sport build gone stale
      # (scripts/picks_refresh.py; the same step runs in picks-refresh.yml on its own schedule)
      - name: Picks refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/picks_refresh.py
      # the paper book is the picks above, graded (scripts/paper_book.py)
      - name: Paper book
        run: python3 scripts/paper_book.py
      # every open pick sent once to Novig's Paper exchange (play money only) and its fills logged against the close
      # (scripts/novig_paper.py -> data/novig_paper.json); no orders until the two Paper-key secrets exist
      - name: Novig Paper orders
        continue-on-error: true
        env:
          NOVIG_PAPER_KEY_ID: ${{ secrets.NOVIG_PAPER_KEY_ID }}
          NOVIG_PAPER_PEM: ${{ secrets.NOVIG_PAPER_PEM }}
        run: python3 scripts/novig_paper.py
      # the Novig alt-line test (scripts/novig_ladder_test.py): graded picks priced on the best ladder rung vs the main one
      - name: Ladder test
        continue-on-error: true
        run: python3 scripts/novig_ladder_test.py
      # homepage ticker: next games of Noah's teams and 1NT (scripts/fetch_ticker.py; ESPN + the site's game models)
      - name: Homepage ticker
        continue-on-error: true
        run: python3 scripts/fetch_ticker.py
      # Standings page: official tables, playoff picture, leaders, polls, rankings, scores (scripts/fetch_standings.py, ESPN)
      - name: Standings
        continue-on-error: true
        run: python3 scripts/fetch_standings.py
      # 1NT live win chance: start .github/workflows/nt-live.yml when a 1NT match is due and none is following it
      - name: 1NT live
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(node scripts/nt_live.mjs --due)" = due ] && [ -z "$(gh run list -w nt-live.yml -s in_progress -L 1 --json databaseId -q '.[].databaseId')" ] && [ -z "$(gh run list -w nt-live.yml -s queued -L 1 --json databaseId -q '.[].databaseId')" ]; then
            gh workflow run nt-live.yml && echo "dispatched 1nt live"
          fi
      # The college basketball slate is re-priced on the newest injury report inside the picks refresh, so its games and
      # injury files ride along (rebuilt on a newer main like the picks: the re-price reruns on the build's snapshot).
      # Only the paper books, the picks, the ticker, the standings and those CBB files are on the site (--site): a snapshot-only commit
      # skips the Cloudflare build. scripts/data_push.py runs the build gate and pushes; when a sport build pushed its
      # picks meanwhile, the picks and the paper book are rebuilt on the new main by rerunning the refresh and the
      # archives are merged line by line, so neither run's rows are dropped (rebase -X theirs dropped them, Nov 1-4).
      - name: Commit if it changed
        run: |
          python3 scripts/data_push.py -m "Odds snapshot, paper book and picks ($(date -u +%Y-%m-%dT%H:%MZ))" \
            --site data/transactions data/ticker.json data/standings.json data/paper_book.json data/props_paper.json data/props_paper_nfl.json data/novig_paper.json 'data/games_picks_*.json' data/cbb_games.json data/cbb_injuries.json \
            --rebuild data/games_picks_cfb.json data/games_picks_nfl.json data/games_picks_cbb.json data/games_picks_nba.json data/games_picks_tennis.json data/paper_book.json data/cbb_games.json data/cbb_injuries.json \
            --regen "GITHUB_TOKEN= python3 scripts/picks_refresh.py; python3 scripts/paper_book.py" \
            -- scripts/data/odds_dense scripts/data/rotowire_news.json scripts/data/rotowire_moves data/roster_audit.json data/transactions data/paper_book.json data/ticker.json data/standings.json \
               scripts/data/odds_novig scripts/data/odds_novig_ladder scripts/data/odds_tp data/novig_ladder_test.json data/novig_paper.json \
               scripts/data/props data/props_paper.json data/props_paper_nfl.json data/props_paper_nhl.json data/games_picks_nflprops.json scripts/data/refs \
               data/games_picks_cfb.json data/games_picks_nfl.json data/games_picks_cbb.json data/games_picks_nba.json data/games_picks_tennis.json scripts/data/odds \
               data/cbb_games.json data/cbb_injuries.json scripts/data/cbb_injury_log
