# Research data for scripts/esea_research.py: ESEA NA league history (scripts/esea_research_fetch.mjs)
# committed to research/esea_matches.json.gz on the branch it runs on. Run by hand from the Actions tab.
# Weekly (Mondays): every region's results again (scripts/esea_regions_fetch.mjs), then scripts/esea_world.py ->
# data/esea_world.json (CS2 Tier 5/6 levels, 1NT's world rank by week, every ESEA team's world rank).
name: esea research

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      regions:
        description: "1 = every region's Advanced/Main/Intermediate results with nicknames (scripts/esea_regions_fetch.mjs) instead"
        default: "0"
      backfill:
        description: "1 = fill 1NT's past regular seasons past FACEIT's 600-match list (scripts/esea_div_backfill.mjs) instead"
        default: "0"
      early:
        description: "1 = seasons 46-52 (before the S53+ files): every region's results + NA box lines, to their own *_early files (CS2 provisional FV driver test)"
        default: "0"
      probe:
        description: "1 = print what the FACEIT API returns for discovery, fetch nothing"
        default: "0"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy
      - uses: actions/cache/restore@v4
        with:
          path: scripts/.cache/cs
          key: cs2-vrs-v1
      - name: Fetch
        if: github.event_name == 'workflow_dispatch' && inputs.regions != '1' && inputs.backfill != '1' && inputs.early != '1'
        run: node scripts/esea_research_fetch.mjs
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          ESEA_CRAWL: 150
          ESEA_FROM: 53
      - name: Fetch every region
        if: github.event_name == 'schedule' || inputs.regions == '1'
        run: node scripts/esea_regions_fetch.mjs
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          ESEA_FROM: 53
          ESEA_PROBE: ${{ inputs.probe == '1' && '1' || '' }}
      - name: Early seasons, every region
        if: inputs.early == '1'
        run: node scripts/esea_regions_fetch.mjs
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          ESEA_FROM: 46
          ESEA_TO: 52
          ESEA_T0: "2023-09-01"
          ESEA_OUT: research/esea_regions_early.json.gz
      - name: Early seasons, NA box lines
        if: inputs.early == '1'
        run: node scripts/esea_research_fetch.mjs
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          ESEA_FROM: 46
          ESEA_TO: 52
          ESEA_CRAWL: 150
          ESEA_NO_SPLITS: 1
          ESEA_OUT: research/esea_matches_early.json.gz
      - name: Backfill 1NT's divisions
        if: inputs.backfill == '1'
        run: node scripts/esea_div_backfill.mjs   # esea.yml rebuilds data/esea_milestones.json from it
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
      # the ESEA-division board test on the newest sealed month (a new look; promoted divisions join the ARK board)
      - name: ESEA board test
        if: github.event_name == 'schedule' || (inputs.regions == '1' && inputs.probe != '1')
        run: python3 scripts/esea_board_research.py || echo "board test failed; keeping the committed result"
      - name: World ranks and ESEA tiers
        if: github.event_name == 'schedule' || (inputs.regions == '1' && inputs.probe != '1')
        run: python3 scripts/esea_world.py
      # ESEA -> pro history snapshot (weekly) and the standing ESEA-only prospect retest (data/esea_pro_test.json)
      - name: ESEA pro history and retest
        if: github.event_name == 'schedule' || (inputs.regions == '1' && inputs.probe != '1')
        run: python3 scripts/esea_pro_history.py || echo "ESEA pro history failed; keeping the committed files"
      # standing retest of the pre-registered provisional (ESEA-only) CS2 FV drivers (scripts/research/cs2_prov_nov23)
      - name: CS2 provisional driver retest
        if: github.event_name == 'schedule' || (inputs.regions == '1' && inputs.probe != '1')
        run: python3 scripts/cs2_prov_research.py > /dev/null || echo "provisional retest failed; keeping the committed result"
      - name: Commit
        run: |
          git config user.name "arkboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f research/esea_matches.json.gz research/esea_regions.json.gz 2>/dev/null || git add -f research/esea_regions.json.gz || git add -f research/esea_matches.json.gz
          git add data/esea_world.json data/esea_board_research.json data/esea_pro_test.json data/cs2_prov_research.json scripts/data/esea_pro_history 2>/dev/null || true
          git add -f research/esea_div_backfill.json.gz 2>/dev/null || true
          git add -f research/esea_regions_early.json.gz research/esea_matches_early.json.gz 2>/dev/null || true
          git commit -m "ESEA research data ($(date -u +%Y-%m-%dT%H:%MZ))" || exit 0
          # main moves every few minutes (odds snaps, sport builds): retry the rebase and push, these files are this job's alone
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
