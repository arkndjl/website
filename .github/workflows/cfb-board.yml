# Rebuilds the College Football ARKBOARD (data/cfb.json) from PFN, On3 and ESPN, and commits it; the push triggers the
# Cloudflare build. The NFL board has its own workflow (nfl.yml, September-February), which also runs after this one. Runs Sunday (twice) through Wednesday, Friday and Saturday during the season, plus a
# daily availability refresh (injury reports and news) twice a day, or by hand from the Actions tab.
name: cfb board

on:
  schedule:
    # 11:17 UTC Sunday, Monday and Tuesday (the week's results, box scores, refits) plus Wednesday, Friday and
    # Saturday (availability news before games), August through January
    - cron: "17 11 * 8-12,1 0,1,2,3,5,6"
    # 16:17 UTC Sunday: PFN posts its regrades of Saturday's games Sunday mid-morning Eastern (stamped 14:13-14:27 UTC
    # on Oct 11, 2026), after the 11:17 run, so this picks them up the same day instead of Monday. The hour of margin
    # also covers the November clock change. On3 college grades don't move week to week, and every run refetches them.
    - cron: "17 16 * 8-12,1 0"
    # 15:47 UTC Tuesday, a backup for the week's rollover: GitHub delays scheduled runs by hours or drops them (Oct 12's
    # 11:17 ran at 20:18, before Monday Night Football; Oct 13's hadn't started by 13:30), and the NFL board only
    # turns to the next week once Monday night's game is final. A run with nothing new commits nothing.
    - cron: "47 15 * 8-12,1 2"
    # the daily availability refresh, every day of the week: practice reports post mid-afternoon Eastern (Monday to
    # Wednesday for Thursday games, Wednesday to Friday for Sunday's, final designations on the last day), Saturday
    # brings activations and Sunday the inactives. 22:37 UTC lands after each day's reports and before Thursday night's
    # kickoff; 03:07 UTC is the backup for a late or dropped run (GitHub has delayed runs by nine hours). Refresh runs
    # pull only the news and the NFL reports and rebuild from the cache: no PFN, On3 or CFBD calls (see the steps).
    - cron: "37 22 * 8-12,1 *"
    - cron: "7 3 * 8-12,1 *"
    # Sunday gameday refresh: inactives post 90 minutes before kickoff (about 15:30 UTC for the early games, 18:40
    # for the late ones). The 16:17 full run covers the early games when it isn't delayed; 18:57 catches the late
    # window's inactives, and the early games' if the 16:17 run slipped. Same refresh as the daily ones.
    - cron: "57 18 * 8-12,1 0"
  workflow_dispatch:
    inputs:
      refresh:
        description: "availability refresh only (news and injury reports, no PFN, On3 or CFBD pulls)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cfb-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REFRESH: ${{ github.event.schedule == '37 22 * 8-12,1 *' || github.event.schedule == '7 3 * 8-12,1 *' || github.event.schedule == '57 18 * 8-12,1 0' || inputs.refresh == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (Chromium, for On3)
        if: env.REFRESH != 'true'
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: ImageMagick (pixel team logos)
        run: sudo apt-get install -y --no-install-recommends imagemagick
      - uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: cfb-${{ github.run_id }}
          restore-keys: cfb-
      # this season's ESPN play-by-play for the game model's history fit (scripts/cfb_espn_md.mjs); free, no CFBD
      # quota. Without it the model falls back to CFBD
      - name: ESPN play-by-play, college football
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/cfb_espn_pbp.py --current
      # game-control ratings (scripts/control_ratings.py): this season's control from the play-by-play cache above, on
      # the committed history, for the game model's 'gc' input (left out when the file is missing)
      - name: Game-control ratings, college football
        continue-on-error: true
        timeout-minutes: 5
        # numpy in its own venv (the runner's system Python has none and refuses pip installs)
        run: |
          python3 -m venv /tmp/gcv && /tmp/gcv/bin/pip install -q numpy
          /tmp/gcv/bin/python scripts/control_ratings.py cfblive
      # ESPN FPI's runs this season, stacked onto the game model's margin (scripts/public_ratings.py, cfb_model.mjs fpiStack)
      - name: ESPN FPI, college football
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/public_ratings.py --cfb-current
      - name: Fetch and grade
        if: env.REFRESH != 'true'
        run: node scripts/fetch_cfb.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      # the refresh: the board from the last full run's cache, with fresh college news, ESPN's schedule and injuries
      # (the injury-aware player projections and game lines). No CFBD key, so it can't spend the quota.
      - name: Refresh college availability
        if: env.REFRESH == 'true'
        continue-on-error: true
        run: node scripts/fetch_cfb.mjs --offline --news
      # the Predictions page's college football picks (scripts/games_picks.py; graded from ESPN's finals)
      - name: Predictions picks, college football
        continue-on-error: true
        run: python3 scripts/games_picks.py cfb
      # the live rule monitor (scripts/rule_monitor.py -> data/rule_monitor.json): every pick and paper rule against the close
      - name: Rule monitor
        continue-on-error: true
        run: python3 scripts/rule_monitor.py
      # backup watch tab, college (scripts/backup_watch_cfb.mjs): by playing time, after the board
      - name: Backup watch, college football
        continue-on-error: true
        run: node scripts/backup_watch_cfb.mjs
      # pre-registered 2027 draft ledger (scripts/draft_ledger.py): a weekly snapshot of the class's FV parts, Draft%
      # and mocks, scored after the draft
      - name: Draft ledger
        continue-on-error: true
        run: python3 scripts/draft_ledger.py snap cfb
      # rookie / first-year leaderboard tab (scripts/rookies.py -> static/data/rookies/cfb.json), display only
      - name: Rookies tab
        continue-on-error: true
        run: python3 scripts/rookies.py cfb
      # each game model's season so far against its own walk-forward record, and the model ledger's one-year re-tests
      # (scripts/model_monitor.py -> data/model_monitor/<sport>.json, on the Predictions page's game models tab)
      - name: Model monitor
        continue-on-error: true
        run: python3 scripts/model_monitor.py cfb
      # team breakdowns for the power rankings' dropdowns (scripts/team_detail.py cfb -> static/data/teams/cfb.json):
      # each FBS team's schedule from ESPN at the ranking's scores, and key players from the board; display only
      - name: Team breakdowns
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/team_detail.py cfb
      - name: Commit if the board changed
        run: |
          git add data/cfb*.json data/model_monitor/cfb.json scripts/data/model_monitor/cfb.json data/backup_cfb.json data/games_picks_cfb.json data/rule_monitor.json static/data/cfb-*.json static/data/teams/cfb.json static/data/rookies/cfb.json static/img/cfb scripts/data/ledger/cfb $(ls scripts/data/odds/cfb-*.jsonl 2>/dev/null)
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "arkboard-bot"; git config user.email "actions@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          python3 scripts/check_build.py || exit 1   # the build gate: strict JSON, file sizes (a bad file breaks every deploy)
          git commit -m "Update the College Football ARKBOARD ($(date -u +%Y-%m-%d))"
          # main often moves while the board builds (merged PRs): rebuild the data commit on the new main and retry.
          # The generated files are taken whole from this run's build. A line-level rebase (-X theirs) kept the other
          # side's non-conflicting hunks of the same JSON, which once doubled picks in the mock draft.
          # Only the files this run changed are taken: a data file it never rebuilds (a model fit, a backtest) is
          # whatever main has, so a PR merged mid-run isn't rolled back to this run's stale checkout.
          data=$(git rev-parse HEAD); changed=$(git diff --name-only --diff-filter=d "$base" "$data"); gone=$(git diff --name-only --diff-filter=D "$base" "$data")
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git fetch origin main && git reset -q --hard origin/main || exit 1
            if [ -n "$changed" ]; then git checkout "$data" -- $changed; fi
            if [ -n "$gone" ]; then git rm -q --ignore-unmatch -- $gone; fi
            git add data/cfb*.json data/model_monitor/cfb.json scripts/data/model_monitor/cfb.json data/backup_cfb.json data/games_picks_cfb.json data/rule_monitor.json static/data/cfb-*.json static/data/teams/cfb.json static/data/rookies/cfb.json static/img/cfb scripts/data/ledger/cfb $(ls scripts/data/odds/cfb-*.jsonl 2>/dev/null)
            if git diff --cached --quiet; then echo "no changes on the new main"; exit 0; fi
            git commit -q -m "Update the College Football ARKBOARD ($(date -u +%Y-%m-%d))"
          done
          exit 1
