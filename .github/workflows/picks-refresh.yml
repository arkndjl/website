# The Predictions page's picks between sport builds (Noah, Oct 27 2026: "make it so that picks auto refresh").
# scripts/picks_refresh.py reruns scripts/games_picks.py for each pick sport in season on DraftKings' current lines
# (through ESPN), and dispatches a sport's build when it has not succeeded for 12 hours. The odds-snap workflow runs
# the same step on every tick; this is a second, offset schedule because GitHub drops most of this repo's scheduled
# runs (odds snap fired about 7 of its 34 a day, Oct 21-27). Shares odds-snap's concurrency group so the two never
# push the same files at once. About 1 minute a run, roughly 350 Actions minutes a month.
name: picks refresh

on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: odds-snap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Picks refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/picks_refresh.py
      - name: Paper book
        run: python3 scripts/paper_book.py
      # homepage ticker: next games of Noah's teams and 1NT (scripts/fetch_ticker.py; ESPN + the site's game models)
      - name: Homepage ticker
        continue-on-error: true
        run: python3 scripts/fetch_ticker.py
      - name: Commit if it changed
        # every sport's picks file (a refresh that wrote one not listed here left it unstaged and the rebase refused, Nov 2).
        # scripts/data_push.py: on a rejected push the picks and the paper book are rebuilt on the new main (the refresh
        # rerun on the newest logs) and the odds archives merged line by line, so a sport build's rows pushed meanwhile stay.
        run: |
          python3 scripts/data_push.py -m "Picks refresh ($(date -u +%Y-%m-%dT%H:%MZ))" \
            --site data/ticker.json data/paper_book.json 'data/games_picks_*.json' \
            --rebuild 'data/games_picks_*.json' data/paper_book.json \
            --regen "GITHUB_TOKEN= python3 scripts/picks_refresh.py; python3 scripts/paper_book.py" \
            -- data/paper_book.json data/ticker.json data/games_picks_*.json scripts/data/odds
