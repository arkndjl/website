# Builds the site with Hugo and deploys it with wrangler from Actions (Cloudflare's own Git build is paused when the
# account's free Workers Builds minutes run out: Nov 19 2026, 3,000/month used up).
# Batched, not per commit: a run waits 10 minutes, then builds the newest main, and skips when the live site already
# serves it (/build.json). The concurrency group keeps one run going and one waiting, so a burst of bot commits makes
# one deploy. Bot commits pushed with GITHUB_TOKEN don't fire `push`, so the half-hourly schedule picks those up.
# Needs repo secret CLOUDFLARE_API_TOKEN (README, Deploying; CLOUDFLARE_ACCOUNT_ID optional); without them the push and
# schedule runs exit quietly and a manual run fails with the setup hint.
name: deploy cloudflare

on:
  push:
    branches: [main]
  # bot data pushes use GITHUB_TOKEN, which fires no push event, so each data workflow's completion triggers a deploy
  # (the batch wait and the live check below debounce it). The schedule is the backup.
  workflow_run:
    workflows:
      - "1nt live"
      - "awards"
      - "cbb board"
      - "cbb boards"
      - "cbb bracket matrix"
      - "cbb recruits"
      - "cfb board"
      - "cfb game research"
      - "cfb mirror parity"
      - "cfb recruits"
      - "cfb recruits cfbd"
      - "cs2"
      - "cs2 market log"
      - "darko log"
      - "data health"
      - "dratings log"
      - "esea 1nt history"
      - "esea econ"
      - "esea probe"
      - "esea research"
      - "esea season"
      - "fiba youth check"
      - "model refits"
      - "nba xpm"
      - "nfl"
      - "nhl"
      - "nhl goalies"
      - "nhl lineups log"
      - "odds snap"
      - "picks refresh"
      - "process refresh"
      - "recruit leans"
      - "recruit news"
      - "rotowire history"
      - "search index"
      - "site stats"
      - "soccer"
      - "soccer extra"
      - "soccer intl"
      - "soccer prospects"
      - "tennis"
      - "tennis prospects"
    types: [completed]
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # a data workflow that failed pushed nothing: only deploy after a success
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # the account id is an identifier, not a credential (it is in every dashboard URL); a secret overrides it
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '52a0657995734fc044113cc765869e15' }}
    steps:
      - name: Check the secrets
        id: sec
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets (README, Deploying)"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && exit 1 || exit 0
      - name: Batch commits
        if: steps.sec.outputs.ok && (github.event_name == 'push' || github.event_name == 'workflow_run')
        run: sleep 600
      - uses: actions/checkout@v4
        if: steps.sec.outputs.ok
        with:
          ref: main
          submodules: recursive
      - name: Skip if the live site already serves main
        if: steps.sec.outputs.ok
        id: live
        run: |
          head=$(git rev-parse HEAD)
          live=$(curl -fsS https://arkndjl.net/build.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))" || true)
          echo "main $head, live $live"
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$live" = "$head" ]; then echo "already live"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: peaceiris/actions-hugo@v3
        if: steps.live.outputs.go
        with:
          hugo-version: "0.147.7"   # the version Cloudflare builds the live site with (build-gate.yml pins the same)
          extended: true
      - name: Build
        if: steps.live.outputs.go
        env:
          WORKERS_CI_COMMIT_SHA: ${{ steps.live.outputs.sha }}
          WORKERS_CI_BRANCH: main
        run: hugo -b https://arkndjl.net   # the Cloudflare build command
      - name: Deploy
        if: steps.live.outputs.go
        run: |
          # pasted secrets can carry a trailing newline or space, which wrangler rejects
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@4 deploy
