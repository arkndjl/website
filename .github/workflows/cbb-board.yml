# Rebuilds the College Basketball ARKBOARD in season (static/data/cbb-all.json, data/cbb_live.json): Barttorvik's
# season-to-date lines blended into each player's preseason grade by minutes played (scripts/cbb_live.py, weights from
# scripts/cbb_live_backtest.py), and commits them; the push triggers the Cloudflare build. Daily from November 1 (the
# 2026-27 opener is Nov 1 in Rome, the full slate Nov 2) through the title game in April, or by hand from the Actions
# tab. The three mock drafts are re-drafted from the new board (scripts/cbb_mock.py --daily). Before the first game, or with no new games, the board doesn't change and nothing is committed.
# The game model (scripts/cbb_games.py) projects the next two slates, re-rates every team, simulates the season and logs
# picks at the line when they're flagged (data/cbb_games.json, data/cbb_picks.json; this season's games and lines in
# scripts/data/cbb_games_2027.json.gz). The 21:41 run refreshes lines and picks before the evening tips.
name: cbb board

on:
  schedule:
    # 10:41 UTC: after the last West Coast games end (about 07:00 UTC) and Barttorvik's overnight update
    - cron: "41 10 * 11,12,1,2,3,4 *"
    # 17:11 UTC, the backup for a late or dropped run (GitHub has delayed scheduled runs by hours, see cfb-board)
    - cron: "11 17 * 11,12,1,2,3,4 *"
    # 21:41 UTC (4:41 pm ET): lines and picks again before the evening games
    - cron: "41 21 * 11,12,1,2,3,4 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbb-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Blend this season into the board
        run: python3 scripts/cbb_live.py
      - name: Re-grade the internationals on this season's league lines
        # Basketball-Reference's international league pages (scripts/cbb_intl.py --daily, the committed fit); a failed pull keeps yesterday's grades
        run: python3 scripts/cbb_intl.py --daily || echo "internationals not updated"
      - name: Re-draft the three mocks from today's board
        # the committed fit, boards and careers (scripts/data/cbb_mock_fit.json, scripts/data/cbb_boards/) plus Tankathon's live order;
        # a failed mock keeps yesterday's file rather than holding back the board
        run: python3 scripts/cbb_mock.py --daily || echo "mock draft not updated"
      - name: Project games, re-rate teams, log picks
        # a failed game build keeps yesterday's files rather than holding back the board
        run: python3 scripts/cbb_games.py || echo "games not updated"
      - name: Player projections
        # points, rebounds and assists for every rotation player in the next two slates (scripts/cbb_players.py)
        run: python3 scripts/cbb_players.py || echo "player projections not updated"
      - name: Refit Dengler Units on the graded live picks
        # scripts/units.py --fit (the same fit games_picks.py --rules runs): live picks and paper bets pool into each
        # market's calibration as they grade; a failed fit keeps yesterday's units
        run: python3 scripts/units.py --fit || echo "units not refit"
      - name: Games page picks
        run: python3 scripts/games_picks.py cbb || echo "games page picks not updated"
      # the live rule monitor (scripts/rule_monitor.py -> data/rule_monitor.json): every pick and paper rule against the close
      - name: Rule monitor
        continue-on-error: true
        run: python3 scripts/rule_monitor.py
      # DraftKings' team futures (title, conference winners), one snapshot a day: no free history exists, so a market
      # preseason prior can only be backtested from this archive (scripts/futures_archive.py)
      - name: Futures archive
        run: python3 scripts/futures_archive.py cbb $(python3 -c "import datetime as d; t=d.date.today(); print(t.year + (t.month >= 8))") || echo "futures not archived"
      - name: Backup watch (minutes order)
        run: python3 scripts/backup_watch.py cbb || echo "backup watch not updated"
      # pre-registered 2027 draft ledger (scripts/draft_ledger.py) and the injury SIT refit on the logged listings
      # (scripts/cbb_sit_refit.py, changes nothing below 400 scored listings)
      - name: Draft ledger and SIT refit
        run: |
          python3 scripts/draft_ledger.py snap cbb || echo "ledger not snapped"
          python3 scripts/cbb_sit_refit.py || echo "sit not refit"
      - name: Commit if the board changed
        run: |
          files="static/data/cbb-all.json data/backup_cbb.json data/cbb_live.json data/cbb_mock.json static/data/cbb-intl.json data/cbb_intl.json data/cbb_games.json data/cbb_players.json data/cbb_injuries.json data/cbb_picks.json data/games_picks_cbb.json data/rule_monitor.json data/units_fit.json scripts/data/cbb_games_2027.json.gz scripts/data/odds/cbb-*.jsonl scripts/data/futures/archive scripts/data/ledger/cbb scripts/data/cbb_injury_log data/cbb_sit_fit.json"
          for f in $files; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "arkboard-bot"; git config user.email "actions@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          python3 scripts/check_build.py || exit 1   # the build gate: strict JSON, file sizes (a bad file breaks every deploy)
          git commit -m "Update the College Basketball ARKBOARD ($(date -u +%Y-%m-%d))"
          # main moves while the board builds (merged PRs): rebuild the data commit on the new main and retry, taking
          # only the files this run changed whole from this run's build, so nothing merged mid-run is rolled back
          # (see cfb-board.yml and PR #199)
          data=$(git rev-parse HEAD); changed=$(git diff --name-only --diff-filter=d "$base" "$data")
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git fetch origin main && git reset -q --hard origin/main || exit 1
            if [ -n "$changed" ]; then git checkout "$data" -- $changed; fi
            for f in $files; do if [ -e "$f" ]; then git add "$f"; fi; done
            if git diff --cached --quiet; then echo "no changes on the new main"; exit 0; fi
            git commit -q -m "Update the College Basketball ARKBOARD ($(date -u +%Y-%m-%d))"
          done
          exit 1
