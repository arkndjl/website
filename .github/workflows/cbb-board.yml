# Rebuilds the College Basketball ARKBOARD in season (static/data/cbb-all.json, data/cbb_live.json): Barttorvik's
# season-to-date lines blended into each player's preseason grade by minutes played (scripts/cbb_live.py, weights from
# scripts/cbb_live_backtest.py), and commits them; the push triggers the Cloudflare build. Daily from November 1 (the
# 2026-27 opener is Nov 1 in Rome, the full slate Nov 2) through the title game in April, or by hand from the Actions
# tab. The three mock drafts are re-drafted from the new board (scripts/cbb_mock.py --daily). Before the first game, or with no new games, the board doesn't change and nothing is committed.
# The game model (scripts/cbb_games.py) projects the next two slates, re-rates every team, simulates the season and logs
# picks at the line when they're flagged (data/cbb_games.json; this season's games and lines in
# scripts/data/cbb_games_2027.json.gz). The 21:41 run refreshes lines and picks before the evening tips.
name: cbb board

on:
  schedule:
    # 07:41 UTC: after the last West Coast games end (about 07:00 UTC). GitHub has started these 4-7 hours late all
    # November, so an earlier slot lands the overnight finals by mid-morning ET
    - cron: "41 7 * 11,12,1,2,3,4 *"
    # 17:11 UTC, the backup for a late or dropped run (GitHub has delayed scheduled runs by hours, see cfb-board)
    - cron: "11 17 * 11,12,1,2,3,4 *"
    # 21:41 UTC (4:41 pm ET): lines and picks again before the evening games
    - cron: "41 21 * 11,12,1,2,3,4 *"
  workflow_dispatch:
  # the cron above has landed the overnight finals between 10 and 11 AM New York all November, after the morning post
  # and the weekly moves' 10 AM cut. The runs these two finish on do fire on time, so the first of them from 5 AM New
  # York with no board run yet that morning starts one (the gate job below)
  workflow_run:
    workflows: ["esea season", "cfb board"]
    types: [completed]

permissions:
  contents: write
  issues: write        # scripts/model_monitor.py opens an issue when a game model's alarm turns on

concurrency:
  group: cbb-board
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/cbb_live.json
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, datetime as dt
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(dt.timezone.utc)
          et = now.astimezone(ZoneInfo('America/New_York'))
          try:
              asof = dt.datetime.fromisoformat(json.load(open('data/cbb_live.json'))['asof'].replace('Z', '+00:00'))
          except Exception:
              asof = now - dt.timedelta(days=1)
          start = et.replace(hour=5, minute=0, second=0, microsecond=0)
          # three tries a morning (5, 7 and 9 AM, the first half hour): a quiet night commits nothing, so asof can't stop it
          print('go=' + str(now.month in (11, 12, 1, 2, 3, 4) and et.hour in (5, 7, 9) and et.minute < 30 and asof < start).lower())
          PY
  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      # Barttorvik's game logs (this season's and last season's) from the last run that got them: his site sometimes
      # answers GitHub's runners with a page instead of the file, and a blocked pull then keeps these and fills the
      # games they lack from ESPN box scores (scripts/cbb_espn_logs.py; the summaries are cached in espn_box)
      - name: Restore Barttorvik game logs
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/.cache/cbb/games_bt
            scripts/.cache/cbb/games/*.json.gz
            scripts/.cache/cbb/espn_box
            scripts/.cache/cbb/lineups
          key: cbb-bt-${{ github.run_id }}
          restore-keys: cbb-bt-
      # birth dates Barttorvik doesn't have yet (hand pins, Wikidata, Wikipedia search, school bios:
      # scripts/cbb_dob.py -> data/cbb_dob.json); the Monday morning run also checks every dated player against Wikidata
      # (data/dob_conflicts_cbb.json)
      - name: Birth dates
        continue-on-error: true
        timeout-minutes: 20
        run: python3 scripts/cbb_dob.py $( [ "$(date -u +%u%H)" = 110 ] && echo --check )
      - name: Blend this season into the board
        run: python3 scripts/cbb_live.py
      # rookie / first-year leaderboard tab (scripts/rookies.py -> static/data/rookies/cbb.json), display only
      - name: Rookies tab
        continue-on-error: true
        run: python3 scripts/rookies.py cbb
      # next up tab: breakout odds + usage tiers (scripts/cbb_breakout.py -> static/data/next-up/cbb.json)
      - name: Next up tab
        continue-on-error: true
        run: python3 scripts/cbb_breakout.py && python3 scripts/next_up.py cbb
      # production tabs (scripts/cbb_tabs.py): stats, WAR leaders, breakouts, top performers, draft board, portal,
      # returning, team talent; display only
      - name: Production tabs
        continue-on-error: true
        run: python3 scripts/cbb_tabs.py
      - name: Re-grade the internationals on this season's league lines
        # Basketball-Reference's international league pages (scripts/cbb_intl.py --daily, the committed fit); a failed pull keeps yesterday's grades
        run: python3 scripts/cbb_intl.py --daily || { echo "internationals not updated"; echo internationals >> /tmp/cbb_failed; }
      - name: International comps
        # each international's nearest 2009-20 draft-day profiles (scripts/cbb_intl_comps.py, committed pool)
        run: python3 scripts/cbb_intl_comps.py || echo "intl comps not updated"
      - name: D-II and D-III players (D-1%)
        # NCAA.com box scores of the last few days (scripts/cbb_lowdiv_pull.py --recent) and the committed fit; a failed pull keeps yesterday's file
        continue-on-error: true
        run: |
          python3 scripts/cbb_lowdiv_pull.py --recent || echo "D-II / D-III box scores not pulled"
          python3 scripts/cbb_lowdiv.py || { echo "D-II / D-III players not updated"; echo "D-II / D-III" >> /tmp/cbb_failed; }
      - name: Re-draft the three mocks from today's board
        # the committed fit, boards and careers (scripts/data/cbb_mock_fit.json, scripts/data/cbb_boards/) plus Tankathon's live order;
        # a failed mock keeps yesterday's file rather than holding back the board
        run: python3 scripts/cbb_mock.py --daily || { echo "mock draft not updated"; echo mocks >> /tmp/cbb_failed; }
      - name: AP and Coaches polls
        # the current releases for the ARK Ranking tab (scripts/cbb_polls_live.py -> data/cbb_polls.json, display only) and
        # this season's releases with points into the poll history (scripts/rank_polls.py; rank_odds.py --record, poll_research.py)
        run: |
          python3 scripts/cbb_polls_live.py || { echo "polls not updated"; echo polls >> /tmp/cbb_failed; }
          python3 scripts/rank_polls.py cbb $(python3 -c "import datetime as d; t=d.date.today(); print(t.year + (t.month >= 8))") $(python3 -c "import datetime as d; t=d.date.today(); print(t.year + (t.month >= 8))") || echo "poll history not updated"
      # team badges (scripts/team_badges.py): this season's trait badges into data/team_badges/cbb.json and the team file;
      # games Barttorvik's getgamestats file lacks come from ESPN box scores (espn_box cache)
      - name: Team badges
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 -m venv /tmp/tbv && /tmp/tbv/bin/pip install -q numpy
          /tmp/tbv/bin/python scripts/team_badges.py build cbb
      - name: Project games, re-rate teams, log picks
        # a failed game build keeps yesterday's files rather than holding back the board
        run: python3 scripts/cbb_games.py || { echo "games not updated"; echo "game model" >> /tmp/cbb_failed; }
      # offense, defense and unit tables for the teams group (scripts/team_units.py -> data/units_cbb.json), display only
      - name: Team units
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/team_units.py cbb
      - name: Player projections
        # points, rebounds and assists for every rotation player in the next two slates (scripts/cbb_players.py)
        run: python3 scripts/cbb_players.py || { echo "player projections not updated"; echo "player projections" >> /tmp/cbb_failed; }
      - name: Market (NIL, staff, coaching jobs, coach pay, team builder)
        # scripts/cbb_market.py: scores the committed fits (data/cbb_market_fit.json) on today's board, ratings and coaches
        run: python3 scripts/cbb_market.py || { echo "market not updated"; echo market >> /tmp/cbb_failed; }
      - name: Team builder, next season
        # scripts/team_builder_next.py: next season's strength, xWins, wins over replacement, NIL dollars a win, the class and DECT on each plan
        continue-on-error: true
        run: python3 scripts/team_builder_next.py
      - name: Refit Dengler Units on the graded live picks
        # scripts/units.py --fit (the same fit games_picks.py --rules runs): live picks and paper bets pool into each
        # market's calibration as they grade; a failed fit keeps yesterday's units
        run: python3 scripts/units.py --fit || echo "units not refit"
      - name: Games page picks
        run: python3 scripts/games_picks.py cbb || { echo "games page picks not updated"; echo "games page picks" >> /tmp/cbb_failed; }
      # the live rule monitor (scripts/rule_monitor.py -> data/rule_monitor.json): every pick and paper rule against the close
      - name: Rule monitor
        continue-on-error: true
        run: python3 scripts/rule_monitor.py
      # DraftKings' team futures (title, conference winners), one snapshot a day: no free history exists, so a market
      # preseason prior can only be backtested from this archive (scripts/futures_archive.py)
      - name: Futures archive
        run: python3 scripts/futures_archive.py cbb $(python3 -c "import datetime as d; t=d.date.today(); print(t.year + (t.month >= 8))") || echo "futures not archived"
      # lineups and on/off tabs (scripts/cbb_lineups.py -> static/data/cbb-lineups.json): NCAA play-by-play substitutions
      # through the ncaa-api proxy, at most ~6 minutes of pulls a run (the stints stay in the Actions cache)
      - name: Lineups and on/off
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/cbb_lineups.py --daily || echo "lineups not updated"
      - name: Backup watch (minutes order)
        run: |
          python3 scripts/backup_watch.py cbb || echo "backup watch not updated"
          python3 scripts/depth_stats.py cbb || echo "depth chart stats not updated"   # key stats for the depth chart GFX card
      # pre-registered 2027 draft ledger (scripts/draft_ledger.py) and the injury SIT refit on the logged listings
      # (scripts/cbb_sit_refit.py, changes nothing below 400 scored listings)
      - name: Draft ledger and SIT refit
        run: |
          python3 scripts/draft_ledger.py snap cbb || echo "ledger not snapped"
          # pre-registered transfer watch ledger (scripts/watch_ledger.py): frozen Dec 25 - Jan 1 and Mar 15 - Apr 5
          python3 scripts/watch_ledger.py players cbb --due || echo "transfer watch not frozen"
          python3 scripts/cbb_sit_refit.py || echo "sit not refit"
      # each game model's season so far against its own walk-forward record, and the model ledger's one-year re-tests
      # (scripts/model_monitor.py -> data/model_monitor/<sport>.json, on the Predictions page's game models tab)
      - name: Model monitor
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/model_monitor.py cbb
      # weekly moves on the player boards: each row gets its metric as of 7 days back (scripts/board_moves.py)
      - name: Board moves
        continue-on-error: true
        run: python3 scripts/board_moves.py cbb r-cbb 'cbb-*'
      - name: Commit if the board changed
        run: |
          files="scripts/data/moves static/data/next-up/cbb.json static/data/next-up/cbb-tab.json data/cbb_dob.json data/dob_conflicts_cbb.json scripts/data/cbb_bt_dob.json scripts/data/school_bios_cbb.json scripts/data/tankathon_nba.json scripts/data/tankathon_draft_days.json data/units_cbb.json data/cbb_market.json data/cbb_watch.json static/data/cbb-builder.json scripts/data/cbb_ynil.json static/data/cbb static/data/cbb-all.json data/cbb_teamtabs.json scripts/data/cbb_xpm_shift.json static/data/cbb-lineups.json static/data/cbb-lineup-leaders.json static/data/rookies/cbb.json data/backup_cbb.json static/data/depth/cbb.json data/cbb_live.json data/cbb_mock.json static/data/cbb-intl.json static/data/cbb-comps-intl.json data/cbb_intl.json static/data/cbb-lowdiv.json scripts/data/cbb_lowdiv/d2-2027.json.gz scripts/data/cbb_lowdiv/d3-2027.json.gz scripts/data/cbb_lowdiv/espn.json.gz data/cbb_games.json data/cbb_polls.json scripts/data/polls/cbb.json data/cbb_players.json data/cbb_injuries.json data/games_picks_cbb.json data/rule_monitor.json data/units_fit.json scripts/data/cbb_games_2027.json.gz scripts/data/odds/cbb-*.jsonl scripts/data/futures/archive scripts/data/ledger/cbb scripts/data/cbb_injury_log scripts/data/cbb_avail_snap.json.gz scripts/data/cbb_avail_prev.json.gz data/cbb_sit_fit.json data/model_monitor/cbb.json scripts/data/model_monitor/cbb.json static/data/teams/cbb.json data/brackets/cbb.json data/team_badges"
          # main moves while the board builds (merged PRs, odds snaps): scripts/data_push.py rebuilds the data commit on
          # the new main, taking only the files this run changed whole (nothing merged mid-run is rolled back, PR #199).
          # The picks log and the rule monitor are shared with the snaps: when main has a newer one they are rebuilt on
          # it (games_picks.py appends to the newest log) instead of copied, and the odds archive is merged by line.
          python3 scripts/data_push.py -m "Update the College Basketball ARKBOARD ($(date -u +%Y-%m-%d))" \
            --rebuild data/games_picks_cbb.json data/rule_monitor.json \
            --regen "python3 scripts/games_picks.py cbb; python3 scripts/rule_monitor.py" \
            -- $files
      # the steps above keep yesterday's file on a failure so one broken step can't hold back the rest; the run still
      # goes red here so a broken step shows in the Actions tab (the game model failed quietly on Nov 2: a missing cbb_games.poss_secs)
      - name: Save Barttorvik game logs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/.cache/cbb/games_bt
            scripts/.cache/cbb/games/*.json.gz
            scripts/.cache/cbb/espn_box
            scripts/.cache/cbb/lineups
          key: cbb-bt-${{ github.run_id }}
      - name: Fail the run if a core step failed
        if: always()
        run: |
          if [ -s /tmp/cbb_failed ]; then echo "::error::not updated: $(paste -sd, /tmp/cbb_failed)"; exit 1; fi
