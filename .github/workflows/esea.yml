# Keeps 1NT's ESEA season on the LAURSEN_111 page live: scripts/fetch_esea.mjs pulls the season's
# matches, maps and player stats from the FACEIT Data API (FACEIT_API_KEY repository secret) every
# 20 minutes and commits data/esea.json only when something changed; the push rebuilds the site.
name: esea season

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "only check demo access (no data written)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: esea
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # match box scores for the rolling player roles, kept between runs (fetched once per match)
      - uses: actions/cache@v4
        with:
          path: .cache/esea
          key: esea-matches-${{ github.run_id }}
          restore-keys: esea-matches-
      - name: Fetch the season
        run: node scripts/fetch_esea.mjs
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          ESEA_DEMO_PROBE: ${{ inputs.probe && '1' || '' }}
      - name: Commit if it changed
        run: |
          git config user.name "arkboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/esea.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          python3 scripts/check_build.py || exit 1   # the build gate: strict JSON, file sizes (a bad file breaks every deploy)
          git commit -m "Update 1NT's ESEA season ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
