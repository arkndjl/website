# ARKBOARD data health (scripts/data_health.py, Nov 2 2026). Opens a GitHub issue (label data-alert) when
#   - a data workflow ends red ("red run: <workflow>"; the job below starts only for a failed run, and the 3-hourly
#     check closes the issue once the workflow's latest run is green),
#   - any feed in data/freshness.json passes its limit ("stale data: <sport>"; the sport's workflow is dispatched
#     on open and at most once a day after), or
#   - arkndjl.net still serves an older build 90 minutes after a commit to main ("deploy stuck"), or
#   - a season calendar step (data/seasons, scripts/season_roll.py) is two days past its date and not done ("season rollover: <step>"), or
#   - a sport's injury news, injury snapshot or one of its sources goes quiet in season ("stale injuries: <sport>").
# Repair (Nov 19 2026): a failed run is read from its log and rerun once when the cause is transient; a stale sport's
# workflow is redispatched 3 h after main moves past its red run, daily otherwise, with the sport's cached-source
# fallback inputs (data/freshness.json) when the red run is on the current main.
# Issues notify the repo owner. Nothing here commits.
name: data health

on:
  workflow_run:
    workflows: [cbb board, cbb boards, cbb recruits, cfb board, cs2, esea season, nba xpm, nfl, nhl, nhl goalies,
                odds snap, picks refresh, soccer, soccer prospects, tennis, tennis prospects, model refits, build gate,
                wave, awards, cfb recruits, cs2 ark loop, esea research, process refresh, recruit leans, recruit news,
                rotowire history, search index, site stats, soccer extra, soccer intl, cbb bracket matrix,
                cs2 market log, darko log, dratings log, nhl lineups log, season roll]
    types: [completed]
  schedule:
    - cron: "13 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  run:
    # failed runs only: a green, skipped or cancelled completion starts no runner (the check job closes recovered issues)
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request' &&
      contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # one alert at a time per workflow. No workflow-level group: every watched workflow's completion starts a run here
    # (1,700 a week, nearly all skipped), and in one shared group a waiting red-run alert was cancelled by the next
    # skipped run that queued behind it
    concurrency:
      group: data-health-run-${{ github.event.workflow_run.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/data_health.py
            data/freshness.json
          sparse-checkout-cone-mode: false
      # the failed log decides the repair: a network/rate-limit/push-race failure reruns its failed jobs once (attempt 1),
      # a code error opens the issue with its traceback (label needs-fix) and is not retried
      - name: Red-run alert and retry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_LOG: ${{ runner.temp }}/failed.log
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null | tail -n 400 > "$RUN_LOG" || true
          python3 scripts/data_health.py run "$RUN_NAME" "$RUN_CONCLUSION" "$RUN_URL"

  check:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: data-health
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Stale feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/data_health.py report
          python3 scripts/data_health.py stale
      - name: Stale injuries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/data_health.py injuries report
          python3 scripts/data_health.py injuries
      - name: Red runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/data_health.py runs
      - name: Season rollovers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/data_health.py rollover
      - name: Deploy stuck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/data_health.py deploy
