<!doctype html><html><head><meta charset="utf-8">
<!-- Square share image, 1200 x 1200, for X's "summary" card thumbnail: the emblem on
     the glyph wallpaper with a giant flipped glyph behind it. -->
<link rel="stylesheet" href="theme.css">
<style>
.canvas { width: 1200px; height: 1200px; --inset: 40px; --grid: 48px; --tile: 120px; --wp: .12; }
.giant.c { left: -100px; top: -100px; width: 1400px; height: 1400px; }
.stripes { left: 40px; right: 40px; top: 40px; } .stripes.b { top: auto; bottom: 40px; }
.emblem { left: 240px; top: 240px; --s: 720px; }
</style></head><body><div class="canvas">
<div class="wallpaper"></div>
<div class="giant c flip"><img src="exports/logo-glyph-deep.svg" alt=""></div>
<div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
<div class="stripes"></div><div class="stripes b"></div>
<div class="emblem"><img src="exports/logo-glyph-lilac.svg" alt=""><b class="n"></b><b class="s"></b><b class="w"></b><b class="e"></b></div>
</div></body></html>
