<!doctype html><html><head><meta charset="utf-8">
<!-- X / Twitter profile header, 1500 x 500. Flat layers: glyph wallpaper, a giant
     deep-purple glyph bleeding off the right, a flipped one off the left, stripe band,
     then emblem, wordmark, sites, badge. Phones show it at about a quarter size, so
     nothing is smaller than 48px. The X mobile app crops about 60px off the top and bottom
     (and more on narrow phones), so all content sits in the y 80-420 band; the profile
     picture covers x < 380, y > 325, so the emblem stays above it. -->
<link rel="stylesheet" href="theme.css">
<style>
.canvas { width: 1500px; height: 500px; --inset: 24px; --grid: 50px; --tile: 100px; --wp: .12; }
.giant.r { left: 860px; top: -150px; width: 800px; height: 800px; }
.giant.l { left: -260px; top: 150px; width: 620px; height: 620px; }
.stripes { left: 440px; right: 24px; top: 24px; }
.stripes.b { top: auto; bottom: 24px; left: 440px; }
.emblem { left: 128px; top: 92px; --s: 208px; }               /* centre y = 196, bottom 300 */
.wordmark { left: 432px; top: 80px; font-size: 96px; }
.links { left: 440px; top: 96px; font-size: 48px; margin-left: 320px; }
.roles { left: 440px; top: 190px; font-size: 48px; --gap: 8px; }    /* three rows end y ~ 415 */
</style></head><body><div class="canvas">
<div class="wallpaper"></div>
<div class="giant r"><img src="exports/logo-glyph-deep.svg" alt=""></div>
<div class="giant l flip"><img src="exports/logo-glyph-deep.svg" alt=""></div>
<div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
<div class="stripes"></div><div class="stripes b"></div>
<div class="emblem"><img src="exports/logo-glyph-lilac.svg" alt=""><b class="n"></b><b class="s"></b><b class="w"></b><b class="e"></b></div>
<div class="wordmark">arkndjl</div>
<div class="links"><img class="site-ico" src="exports/logo-glyph-lilac.svg" alt=""><a href="https://arkndjl.net">arkndjl.net</a><span class="sep">::</span><img class="site-ico" src="exports/partners/eephus-favicon.svg" alt=""><a href="https://eephus.io">eephus.io</a></div>
<div class="roles">
<div><span class="badge co dl"><img src="exports/partners/driveline-logo-orange.png" alt="Driveline Baseball"><span class="sep">::</span>Baseball Operations Analyst</span></div>
<div><span class="badge co ag"><img src="exports/partners/agentiq-wordmark.svg" alt="Agentiq"><span class="sep">::</span>Data Science Consultant</span></div>
<div><span class="badge co nyu"><img src="exports/partners/nyu-torch-white.svg" alt="NYU">NYU Mathematics &amp; Economics</span></div>
</div>
</div></body></html>
