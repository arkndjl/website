<!doctype html><html><head><meta charset="utf-8">
<!-- X / Twitter profile header, 1500 x 500. Flat layers: glyph wallpaper, giant deep-purple
     glyphs bleeding off both sides, stripe bands, then one centred column: wordmark, sites,
     employer badges. Laid out for the X phone app, which is the tightest view: it crops
     about 125px off each side, puts the status bar over y < 115 and the back / more / search
     buttons over y 176-304 at x < 310 and x > 1035, and the profile picture over x < 410,
     y > 450. So content stays inside x 330-1015, y 116-446; no emblem (the profile picture
     already carries the glyph). -->
<link rel="stylesheet" href="theme.css">
<style>
.canvas { width: 1500px; height: 500px; --inset: 24px; --grid: 50px; --tile: 100px; --wp: .12; }
.giant.r { left: 1000px; top: -150px; width: 800px; height: 800px; }
.giant.l { left: -300px; top: 150px; width: 620px; height: 620px; }
.stripes { left: 24px; right: 24px; top: 24px; }
.stripes.b { top: auto; bottom: 24px; }
.col { left: 330px; width: 685px; top: 116px; display: flex; flex-direction: column; align-items: center; }
.col > * { position: static; }
.wordmark { font-size: 112px; }
.links { font-size: 32px; margin-top: 10px; }
.roles { font-size: 32px; --gap: 8px; margin-top: 18px; align-items: center; }
</style></head><body><div class="canvas">
<div class="wallpaper"></div>
<div class="giant r"><img src="exports/logo-glyph-deep.svg" alt=""></div>
<div class="giant l flip"><img src="exports/logo-glyph-deep.svg" alt=""></div>
<div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
<div class="stripes"></div><div class="stripes b"></div>
<div class="col">
<div class="wordmark">arkndjl</div>
<div class="links"><img class="site-ico" src="exports/logo-glyph-lilac.svg" alt=""><a href="https://arkndjl.net">arkndjl.net</a><span class="sep">::</span><img class="site-ico" src="exports/partners/eephus-favicon.svg" alt=""><a href="https://eephus.io">eephus.io</a></div>
<div class="roles">
<div><span class="badge co dl"><img src="exports/partners/driveline-logo-orange.png" alt="Driveline Baseball"><span class="sep">::</span>Baseball Operations Analyst</span></div>
<div><span class="badge co ag"><img src="exports/partners/agentiq-wordmark.svg" alt="Agentiq"><span class="sep">::</span>Data Science Consultant</span></div>
<div><span class="badge co nyu"><img src="exports/partners/nyu-torch-white.svg" alt="NYU">NYU Mathematics &amp; Economics</span></div>
</div>
</div>
</div></body></html>
