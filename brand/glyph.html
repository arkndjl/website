<!doctype html><html><head><meta charset="utf-8">
<!-- The 🜎 glyph (U+1F70E, alchemical symbol for philosophers' sulfur) alone on a
     transparent canvas, in Noto Sans Symbols. render.js trims it to its ink and
     centers it on the logo canvas. Open with #lavender for the inverse color. -->
<style>
@font-face { font-family: "Noto Sans Symbols"; src: url("fonts/NotoSansSymbols[wght].ttf") format("truetype"); font-weight: 400 700; }
html,body { margin:0; background:transparent; width:1200px; height:1200px; overflow:hidden; }
.g { font-family: "Noto Sans Symbols"; font-weight: 500; font-size: 700px; line-height: 1200px; text-align: center; color: #4a3b6b; }
body.lavender .g { color: #c8c7ff; }
</style></head><body><div class="g">🜎</div>
<script>if (location.hash === '#lavender') document.body.classList.add('lavender');</script>
</body></html>
