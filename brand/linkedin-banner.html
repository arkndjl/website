.giant.l { left: -220px; top: 120px; width: 520px; height: 520px; }

.stripes.b { top: auto; bottom: 24px; left: 400px; }
.wordmark { left: 400px; top: 52px; font-size: 128px; }
.links { left: 400px; top: 72px; font-size: 48px; margin-left: 460px; }
.roles { left: 416px; top: 196px; font-size: 32px; --gap: 12px; }   /* ends y ~ 352 */
</style></head><body><div class="canvas">
