<!doctype html><html><head><meta charset="utf-8">
<!-- YouTube channel banner, 2560 x 1440. The lockup sits inside YouTube's 1546 x 423
     safe area (x 507-2053, y 508-931); the rings, ruler ticks and faint glyphs outside it
     only show on desktop and TV. -->
<link rel="stylesheet" href="theme.css">
<style>
.canvas { width: 2560px; height: 1440px; --inset: 40px; --grid: 64px; }
/* concentric rings centred on the emblem */
.ring { border-radius: 50%; border: 1px solid rgba(200,199,255,.17); left: calc(895px - var(--r)); top: calc(720px - var(--r)); width: calc(var(--r) * 2); height: calc(var(--r) * 2); }
.ring.hot { border-color: rgba(200,199,255,.32); }
/* ruler ticks along the top and bottom frame edges */
.ticks { left: 40px; right: 40px; height: 14px; background: repeating-linear-gradient(90deg, rgba(200,199,255,.45) 0 2px, transparent 2px 64px); }
.ticks.top { top: 41px; } .ticks.bottom { bottom: 41px; }
/* faint glyphs far left and right */
.ghost { width: 440px; height: 440px; opacity: .10; top: 500px; }
.ghost.l { left: 110px; } .ghost.r { right: 110px; }
.ghost img { width: 100%; height: 100%; }
.axis { left: 40px; right: 40px; top: 720px; height: 1px; background: rgba(200,199,255,.16); }
.emblem { left: 745px; top: 570px; --s: 300px; }
.wordmark { left: 1104px; top: 640px; font-size: 172px; }
</style></head><body><div class="canvas">
<div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
<div class="ticks top"></div><div class="ticks bottom"></div>
<div class="axis"></div>
<div class="ring hot" style="--r:230px"></div>
<div class="ring" style="--r:330px"></div>
<div class="ring" style="--r:470px"></div>
<div class="ring" style="--r:650px"></div>
<div class="ring" style="--r:900px"></div>
<div class="ring" style="--r:1200px"></div>
<div class="ghost l"><img src="exports/logo-glyph-lilac.svg" alt=""></div>
<div class="ghost r"><img src="exports/logo-glyph-lilac.svg" alt=""></div>
<div class="emblem"><img src="exports/logo-glyph-lilac.svg" alt=""><b class="n"></b><b class="s"></b><b class="w"></b><b class="e"></b></div>
<div class="wordmark">arkndjl</div>
</div></body></html>
