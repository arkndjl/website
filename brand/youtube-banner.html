<!doctype html><html><head><meta charset="utf-8">
<!-- YouTube channel banner, 2560 x 1440. Content inside the 1546 x 423 safe area
     (x 507-2053, y 508-931). Outside it: wallpaper, three giant glyphs (one full-height
     behind the lockup, two flipped at the sides), rings and stripe bands. -->
<link rel="stylesheet" href="theme.css">
<style>
.canvas { width: 2560px; height: 1440px; --inset: 40px; --grid: 64px; --tile: 128px; --wp: .12; }
.giant.c { left: 460px; top: -120px; width: 1640px; height: 1640px; }
.giant.l { left: -360px; top: 420px; width: 900px; height: 900px; }
.giant.r { left: 2020px; top: 420px; width: 900px; height: 900px; }
.ring { border-radius: 50%; border: 2px solid rgba(200,199,255,.28); left: calc(1280px - var(--r)); top: calc(720px - var(--r)); width: calc(var(--r) * 2); height: calc(var(--r) * 2); }
.stripes { left: 40px; right: 40px; top: 40px; height: 16px; background: repeating-linear-gradient(90deg, var(--lilac) 0 2px, transparent 2px 10px); }
.stripes.b { top: auto; bottom: 40px; }
.stripes.v { top: 40px; bottom: 40px; width: 16px; height: auto; }
.stripes.v.l { left: 40px; } .stripes.v.r { right: 40px; }
.emblem { left: 547px; top: 560px; --s: 300px; }              /* centre (697, 710) */
.wordmark { left: 900px; top: 544px; font-size: 176px; }
.links { left: 900px; top: 744px; font-size: 48px; }
.badge-row { left: 900px; top: 816px; font-size: 48px; }
</style></head><body><div class="canvas">
<div class="wallpaper"></div>
<div class="giant c"><img src="exports/logo-glyph-deep.svg" alt=""></div>
<div class="giant l flip"><img src="exports/logo-glyph-deep.svg" alt=""></div>
<div class="giant r flip"><img src="exports/logo-glyph-deep.svg" alt=""></div>
<div class="ring" style="--r:520px"></div>
<div class="ring" style="--r:760px"></div>
<div class="ring" style="--r:1040px"></div>
<div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
<div class="stripes"></div><div class="stripes b"></div><div class="stripes v l"></div><div class="stripes v r"></div>
<div class="emblem"><img src="exports/logo-glyph-lilac.svg" alt=""><b class="n"></b><b class="s"></b><b class="w"></b><b class="e"></b></div>
<div class="wordmark">arkndjl</div>
<div class="links"><a href="https://arkndjl.net">arkndjl.net</a><span class="sep">::</span><a href="https://eephus.io">eephus.io</a></div>
<div class="badge-row"><span class="badge">NYU Mathematics &amp; Economics</span></div>
</div></body></html>
